AP4L_TEMPLATES:
  name: AP4L_TEMPLATES
  templates:
    advice:
    - (help|advise) me
    - (what |how )?(can|do|should|could) I
    - what'?s the [a-z]+st way to
    - is it [a-z]+ to
    - (tell|teach|show) me how (to|I)
    - (I('?d)* (really )*(want|need|(would )?like)|give me) (your |some |any )?(advice|help|suggestions?|thoughts?|input|ideas?)
    - how to do (it|that)
    - is (this|that|it) an? [a-z]+ idea
    - is my idea [a-z]+
    - do you have (any |some )?(advice|help|suggestions?|thoughts?|input|ideas?)
    - what do you think (about|of) (it|that|my|this)
    roleplay:
    - pretend (to be|you('| a)?re?) (my|him|her|them|someone|an?)
    - (role( |-)?)?play as (my|him|her|them|someone|an?)
    - (pretend|respond|talk|act|behave|speak) (to me )*(like|as( if)?) (you( we| a|')?re? )?(my|him|her|them|someone|an?)
    - practi[cs]e [a-z]*ing (to )*(my|him|her|them|someone|an?)
    breakup:
    - break(ing)?( |-)?up with?
    - end(ing)? (it|things) with?
    - finish(ing)? (things )?with?
    - call(ing)? (it|things) off with?
    - tell(ing)? (my |a )? ([a-z]+ )+ (that )*(it('| i)?s|we('| a)?re|things are) (finished|over|through|done|thru)
    - tell(ing)? ([a-z]+ )+ (that )*I('| a)*m (going to |planning on |gonna |finna )*leav[a-z]+
    - leav(e|ing)? (my |a ) [a-z]+\W?$
    - (I|we('?ve)?) (need to|should|have to|got to|gotta|gonna)? break( |-)?up
    - call (off )*(my )*(wedding|engagement)( off )*
    - \bend (my )*(relationship|engagement)
    queer:
    - trans[a-z]*
    - (?!het)[a-z]+sexual
    - (?!cis)[a-z]+gender
    - genderfluid
    - gay
    - (a )?lesbian
    - LGBT[A-Z]*
    - pansexual
    - queer
    - same gender loving
    - a bear
    - a butch
    - a cub
    - a dyke
    - a femme
    - a stud
    - a twink
    - latinx
    - non( |-)?binary
    - enby
    - transfem[a-z]*
    - transmasc(uline)?
    - two( |-)?spirit
    - queer
    - bi
    - pan
    - homo
    - ace
    comeout:
    - com(e|ing)? out
    - tell(ing)? ([a-z-]+ )?I('| a)?m
    - let(ting)? ([a-z]+ )+know (that )?I('| a)?m
  set_A:
  - advice
  - roleplay
  set_B:
  - breakup
  - queer
  - comeout
